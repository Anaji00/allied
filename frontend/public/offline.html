<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · Allied Operations</title>
  <!-- Shown by the service worker when a page cannot load. Self-contained: no network needed. -->
  <style>
    :root { --bg: #f8f9fb; --fg: #1d2129; --muted: #6b7280; --border: #e3e6eb; --btn: #1d2129; --btn-fg: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111317; --fg: #eef0f3; --muted: #9aa0aa; --border: #2a2e35; --btn: #eef0f3; --btn-fg: #15171b; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--fg);
      font: 16px/1.5 "IBM Plex Sans", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    }
    main { max-width: 340px; text-align: center; }
    svg { width: 56px; height: 56px; }
    h1 { font-size: 1.25rem; margin: 20px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    button {
      appearance: none; border: 0; border-radius: 8px; padding: 12px 20px; min-width: 160px;
      background: var(--btn); color: var(--btn-fg); font: inherit; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <polygon points="20,0 40,20 20,40 0,20" fill="#D32F2F" />
      <polygon points="20,8 32,20 20,32 8,20" fill="currentColor" />
      <path d="M20,12 L26,20 L20,28 L14,20 Z" fill="#D32F2F" />
    </svg>
    <h1>No connection</h1>
    <p>Allied Operations can't reach the office server. Check your Wi‑Fi or signal, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
